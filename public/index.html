<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Doc.lk Channel Watcher</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="shell">
      <section class="workspace" aria-labelledby="page-title">
        <div class="brand-row">
          <div class="brand-mark" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
          </div>
          <div>
            <p class="eyebrow">Doc.lk availability alerts</p>
            <h1 id="page-title">Channel Watcher</h1>
          </div>
          <div class="header-actions" aria-label="Project links">
            <a href="https://github.com/VihangaDev/doclk-channel-watcher" target="_blank" rel="noreferrer">GitHub</a>
            <a href="https://github.com/VihangaDev/doclk-channel-watcher/tree/main/docs" target="_blank" rel="noreferrer">Docs</a>
          </div>
        </div>

        <div class="control-panel">
          <form class="search-form" id="doctor-search-form">
            <label for="doctor-query">Doctor search</label>
            <div class="input-row">
              <input
                id="doctor-query"
                name="doctor"
                type="search"
                autocomplete="off"
                list="doctor-suggestions"
                placeholder="Kapila Ranasinghe"
                required
              >
              <button type="submit">Search</button>
            </div>
            <datalist id="doctor-suggestions"></datalist>
          </form>

          <div class="hospital-filter" id="hospital-filter" hidden></div>

          <form class="watch-form compact-form" id="watch-form">
            <label for="channel-url">Direct Doc.lk channel URL</label>
            <div class="input-row">
              <input id="channel-url" name="url" type="url" inputmode="url" placeholder="https://www.doc.lk/channel/31317">
              <button type="submit">Check</button>
            </div>
          </form>

          <div class="actions">
            <button id="subscribe-button" type="button">Telegram alerts</button>
            <a id="telegram-link" class="telegram-link" href="#" target="_blank" rel="noreferrer" hidden>Open Telegram</a>
          </div>
        </div>

        <section class="status-panel" id="status-panel" aria-live="polite">
          <div class="empty-state">
            <strong>No channel selected</strong>
            <span>Waiting for a Doc.lk channel.</span>
          </div>
        </section>
      </section>

      <aside class="side-panel" aria-label="Service state">
        <div class="metric">
          <span>Service</span>
          <strong id="service-state">Checking</strong>
        </div>
        <div class="metric">
          <span>Subscribers</span>
          <strong id="subscriber-count">0</strong>
        </div>
        <div class="metric">
          <span>Channels</span>
          <strong id="channel-count">0</strong>
        </div>
        <div class="metric">
          <span>Telegram</span>
          <strong id="telegram-state">Checking</strong>
        </div>
        <div class="note" id="service-note">
          Subscription activation depends on the configured Telegram bot.
        </div>
      </aside>
    </main>

    <script src="/app.js" type="module"></script>
  </body>
</html>
